name: Release operations

on:
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, edited, labeled, milestoned, demilestoned, closed, reopened]
  pull_request_target:
    types: [opened, edited, reopened, closed, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: ['Release review observer']
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ucm-release-operations-${{ github.repository }}
  cancel-in-progress: false

jobs:
  operate:
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null ||
      (github.event.action == 'created' &&
       (startsWith(github.event.comment.body, '/release_init') ||
        startsWith(github.event.comment.body, '/update') ||
        startsWith(github.event.comment.body, '/release_check') ||
        startsWith(github.event.comment.body, '/release_ready') ||
        startsWith(github.event.comment.body, '/release_publish')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify controller contracts
        run: python -m unittest discover -s .github/release-operations -p 'test_*.py' -v
      - name: Execute version operation
        env:
          GH_TOKEN: ${{ github.token }}
          UCM_PROJECT_TOKEN: ${{ secrets.UCM_PROJECT_TOKEN }}
        run: python .github/release-operations/controller.py
      - name: Finalize operation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UCM_JOB_STATUS: ${{ job.status }}
        run: python .github/release-operations/controller.py --finalize
