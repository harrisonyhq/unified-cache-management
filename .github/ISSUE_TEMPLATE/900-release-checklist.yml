name: Release Checklist
description: Plan and manage a release through structured requirements and a checklist.
title: '[Release] UCM v'
labels: [release]
body:
  - type: textarea
    id: release_information
    attributes:
      label: Release Information
      description: Complete this section. The bot maintains version links and the bottom overview.
      value: |
        <!-- ucm-release-navigation:start -->
        Version links will appear after initialization.
        <!-- ucm-release-navigation:end -->

        version: 0.12.0
        branch: main
        goal: Complete the planned integrations and interface updates.
        release_manager:
        test_lead:
        release_date: TBD
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Use two spaces for title continuations and fields, and four spaces for description content. A title without an Issue reference creates a new Issue. Add an Issue reference to reuse an existing Issue. The bot maintains pull_requests.
      value: |
        - MiniMax M3.1 support
          with vLLM-Ascend v0.32.0

          description:
            Integrate MiniMax M3.1 with vLLM-Ascend v0.32.0.

            Acceptance criteria:
            - Complete model loading and inference.
            - Verify cache reuse.
            - Document the supported configuration.

          assignee:

          pull_requests:

        - Connector v2 integration
          for the first release

          description:
            Complete the initial Connector v2 integration.

            Scope:
            - Define the connector interface.
            - Implement the initial integration.
            - Provide configuration examples.

            Acceptance criteria:
            - Pass the functional tests.
            - Document the interface and usage.

          assignee:

          pull_requests:
    validations:
      required: true
  - type: textarea
    id: release_notes
    attributes:
      label: Release Notes
      description: Review and update this section.
      value: |
        - [ ] Summarize new features.
        - [ ] Summarize bug fixes.
        - [ ] Document compatibility changes.
        - [ ] Document upgrade instructions.
        - [ ] Document known issues.
  - type: textarea
    id: functional_tests
    attributes:
      label: Functional Tests
      description: Review and update this section.
      value: |
        - [ ] Verify the requirements in this release.
        - [ ] Verify the bug fixes targeted for this release.
        - [ ] Record test results and evidence.
        - [ ] Review unresolved bugs and release blockers.
  - type: textarea
    id: documentation_tests
    attributes:
      label: Documentation Tests
      description: Review and update this section.
      value: |
        - [ ] Verify installation instructions.
        - [ ] Verify configuration and usage examples.
        - [ ] Update the user guide.
        - [ ] Update the developer guide.
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts
      description: Review and update this section.
      value: |
        - [ ] Build and verify the wheel package.
        - [ ] Build and verify the container image.
        - [ ] Confirm artifact versions match the release version.
  - type: textarea
    id: release_steps
    attributes:
      label: Release Steps
      description: Review and update this section.
      value: |
        - [ ] Confirm the release scope.
        - [ ] Merge the required pull requests.
        - [ ] Review and close completed requirements and resolved Bugs.
        - [ ] Resolve release blockers.
        - [ ] Finalize the release notes.
        - [ ] Run /release_check and review the result.
        - [ ] Run /release_publish.
        - [ ] Verify the GitHub Release and tag.
        - [ ] Publish the wheel package and container image.
        - [ ] Verify the published artifacts.
        - [ ] Confirm the milestone and release issue are closed.
  - type: textarea
    id: change_log
    attributes:
      label: Change Log
      description: Review and update this section.
      value: |
        reason: Initial scope.
