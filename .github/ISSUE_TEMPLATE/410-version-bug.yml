name: Version test bug
description: Report a bug found while testing a version; add it under the version's Bug Archive.
title: '[Bug] '
labels: [bug, 'status:triage']
body:
  - type: textarea
    id: report
    attributes:
      label: Bug Report
      value: |
        source_bug_archive:
        requirement:
        tested_commit_or_image:
        environment:
        reproduction_steps:
        expected_result:
        actual_result:
        frequency:
        evidence:
    validations:
      required: true
